<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Ninja - Performance Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands Library - Using specific version for stability -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c1a10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #3d2b1f; /* Dojo floor base color */
            transition: transform 0.1s ease-out;
        }
        /* Both video and canvas are mirrored for a natural "mirror" experience */
        #input-video, #game-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #input-video {
            opacity: 0.01; /* Must be slightly visible for some browsers to keep tracking active */
            pointer-events: none;
            z-index: 0;
        }
        #game-canvas {
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .menu-card {
            pointer-events: auto;
            background: rgba(30, 15, 10, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 3rem;
            text-align: center;
            border: 2px solid rgba(139, 69, 19, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <video id="input-video" playsinline muted></video>
    <canvas id="game-canvas"></canvas>

    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud" class="flex justify-between items-start w-full opacity-0 transition-opacity duration-500">
            <div class="flex flex-col">
                <div class="text-xs uppercase tracking-[0.3em] text-orange-400 mb-1">Score</div>
                <div class="text-7xl font-black italic tracking-tighter" id="score-val">0</div>
                <div class="text-[10px] uppercase tracking-widest text-white/40 mt-1" id="difficulty-indicator">Level: Beginner</div>
            </div>
            <div class="flex flex-col items-end">
                <div id="lives-container" class="text-4xl filter drop-shadow-[0_0_10px_rgba(255,0,0,0.5)]">❤️❤️❤️</div>
                <div class="text-[10px] uppercase tracking-widest mt-3 opacity-60 bg-black/40 px-3 py-1 rounded-full border border-white/10">Precision Dojo</div>
            </div>
        </div>

        <!-- Start Menu -->
        <div id="start-menu" class="m-auto menu-card max-w-lg transition-opacity duration-300">
            <h1 class="text-7xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-br from-orange-400 to-red-700 italic tracking-tighter">HAND NINJA</h1>
            <p class="mb-10 text-lg text-orange-100/80 font-light">Balanced fruit sizes, precision tracking. <br>Move your hand to wake the Sensei.</p>
            
            <button id="start-btn" class="hidden bg-orange-800 hover:bg-orange-700 text-white font-bold py-5 px-16 rounded-2xl text-2xl transition-all border-b-4 border-orange-950 shadow-lg active:translate-y-1 active:border-b-0">
                ENTER DOJO
            </button>
            
            <div id="loading-msg" class="mt-8 text-xs text-orange-500 font-mono tracking-widest uppercase animate-pulse">
                Detecting Hand...
            </div>
        </div>

        <!-- Game Over Menu -->
        <div id="game-over-menu" class="m-auto menu-card hidden">
            <h1 class="text-6xl font-black mb-2 text-red-600 italic tracking-tighter">DISHONOR!</h1>
            <p class="text-4xl mb-8 font-light text-orange-100">Final Score: <span class="font-bold text-orange-500" id="final-score">0</span></p>
            <button id="restart-btn" class="bg-orange-100 text-orange-900 font-black py-4 px-12 rounded-xl text-xl hover:bg-white transition-all">
                TRY AGAIN
            </button>
        </div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input-video');
    const canvasElement = document.getElementById('game-canvas');
    const gameContainer = document.getElementById('game-container');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const difficultyIndicator = document.getElementById('difficulty-indicator');
    const livesContainer = document.getElementById('lives-container');
    const startMenu = document.getElementById('start-menu');
    const startBtn = document.getElementById('start-btn');
    const gameOverMenu = document.getElementById('game-over-menu');
    const hud = document.getElementById('hud');
    const finalScoreDisplay = document.getElementById('final-score');
    const loadingMsg = document.getElementById('loading-msg');

    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');

    let score = 0;
    let lives = 3;
    let isGameRunning = false;
    let isTrackingWarmedUp = false;
    let fruits = [];
    let slicedPieces = []; 
    let particles = [];
    let handPath = []; 
    const MAX_PATH_LENGTH = 10; 
    const MAX_PARTICLES = 80;
    const MAX_PIECES = 25;
    
    const FRUIT_TYPES = [
        { emoji: '🍎', points: 10, size: 85,  hitbox: 1.6, color: '#ff3b30' },
        { emoji: '🍊', points: 10, size: 80,  hitbox: 1.6, color: '#ff9500' },
        { emoji: '🍉', points: 20, size: 120, hitbox: 1.9, color: '#4cd964' },
        { emoji: '🍍', points: 15, size: 105, hitbox: 1.7, color: '#ffcc00' },
        { emoji: '🍓', points: 5, size: 60,  hitbox: 1.5, color: '#ff2d55' },
        { emoji: '🍇', points: 12, size: 75,  hitbox: 1.6, color: '#af52de' },
        { emoji: '🥝', points: 18, size: 70,  hitbox: 1.5, color: '#8bc34a' },
        { emoji: '🍑', points: 10, size: 85,  hitbox: 1.6, color: '#ffab91' },
        { emoji: '🍋', points: 10, size: 80,  hitbox: 1.6, color: '#ffeb3b' },
        { emoji: '🍌', points: 15, size: 90,  hitbox: 1.7, color: '#ffd600' }
    ];
    const BOMB_TYPE = { emoji: '💣', points: -1, size: 85, hitbox: 1.0, isBomb: true, color: '#000000' };

    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6,
        selfieMode: true // Essential for the mirrored display
    });

    hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            if (!isTrackingWarmedUp) {
                isTrackingWarmedUp = true;
                loadingMsg.innerText = "Tracking Active";
                startBtn.classList.remove('hidden');
                setTimeout(() => loadingMsg.classList.add('hidden'), 500);
            }

            const landmarks = results.multiHandLandmarks[0];
            const tip = landmarks[8]; 
            const currentFingerPos = getCanvasCoords(tip);
            
            if (isGameRunning && handPath.length > 0) {
                checkSlices(handPath[handPath.length - 1], currentFingerPos);
            }
            
            handPath.push(currentFingerPos);
            if (handPath.length > MAX_PATH_LENGTH) handPath.shift();
        } else {
            handPath = [];
        }
    });

    function resizeCanvas() {
        // Ensure dimensions are valid
        const w = window.innerWidth || 100;
        const h = window.innerHeight || 100;
        
        canvasElement.width = w;
        canvasElement.height = h;
        bgCanvas.width = w;
        bgCanvas.height = h;
        
        drawDojoFloor(bgCtx, true);
        
        // Final guard against 0 width/height before drawImage
        if (!isGameRunning && bgCanvas.width > 0 && bgCanvas.height > 0) {
            canvasCtx.drawImage(bgCanvas, 0, 0);
        }
    }

    function drawDojoFloor(ctx, clear = false) {
        if (!ctx.canvas.width || !ctx.canvas.height) return;
        
        if (clear) {
            ctx.fillStyle = '#3d2b1f';
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        }
        ctx.save();
        ctx.strokeStyle = '#4a3526';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 1.0;
        for(let x=0; x < ctx.canvas.width; x += 80) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ctx.canvas.height); ctx.stroke();
        }
        for(let y=0; y < ctx.canvas.height; y += 80) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(ctx.canvas.width, y); ctx.stroke();
        }
        ctx.restore();
    }

    window.addEventListener('resize', resizeCanvas);

    function getCanvasCoords(landmark) {
        const videoWidth = videoElement.videoWidth || 1280;
        const videoHeight = videoElement.videoHeight || 720;
        const canvasWidth = canvasElement.width || window.innerWidth || 1280;
        const canvasHeight = canvasElement.height || window.innerHeight || 720;

        // Calculate scaling to match object-fit: cover
        const scale = Math.max(canvasWidth / videoWidth, canvasHeight / videoHeight);
        
        // This calculates the position of the sensor's origin in canvas space
        const sensorXAt0 = (canvasWidth - videoWidth * scale) / 2;
        const sensorYAt0 = (canvasHeight - videoHeight * scale) / 2;

        // Map normalized landmark to the correctly scaled and positioned canvas coordinate
        const mappedX = sensorXAt0 + (landmark.x * videoWidth * scale);
        const mappedY = sensorYAt0 + (landmark.y * videoHeight * scale);

        // Mirror check: Since the canvas is mirrored with CSS scaleX(-1), 
        // to draw a point at screen-left, we need to draw at canvas-right.
        // landmark.x = 0 is user-left (screen-left) because of selfieMode: true.
        // So landmark.x = 0 -> mappedX near 0.
        // To show up on screen-left, the canvas needs the point at canvasWidth - mappedX.
        return {
            x: canvasWidth - mappedX,
            y: mappedY
        };
    }

    function getDifficulty() {
        return Math.min(score / 5000, 1.0);
    }

    function updateDifficultyUI() {
        const d = getDifficulty();
        let rank = "Beginner";
        if (d > 0.8) rank = "Grandmaster";
        else if (d > 0.6) rank = "Master";
        else if (d > 0.4) rank = "Ninja";
        else if (d > 0.2) rank = "Apprentice";
        difficultyIndicator.innerText = `Level: ${rank}`;
    }

    function addSplatterToBackground(x, y, color) {
        bgCtx.save();
        bgCtx.translate(x, y);
        bgCtx.fillStyle = color;
        bgCtx.globalAlpha = 0.55;
        const numBlobs = 8 + Math.floor(Math.random() * 5);
        for(let i=0; i < numBlobs; i++) {
            const ox = (Math.random() - 0.5) * 100;
            const oy = (Math.random() - 0.5) * 100;
            const r = Math.random() * 25 + 5;
            bgCtx.beginPath(); bgCtx.arc(ox, oy, r, 0, Math.PI * 2); bgCtx.fill();
            bgCtx.fillRect(ox - 2, oy, 4, Math.random() * 50 + 10);
        }
        bgCtx.restore();
    }

    class SlicedPiece {
        constructor(x, y, vx, vy, rotation, rv, emoji, size, side) {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy;
            this.rotation = rotation; this.rv = rv;
            this.emoji = emoji; this.size = size; this.side = side; 
            this.gravity = 0.25; this.alpha = 1;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.vy += this.gravity; this.rotation += this.rv;
            this.alpha -= 0.03;
            return this.y < canvasElement.height + 150 && this.alpha > 0;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.font = `${this.size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.beginPath();
            if (this.side === 0) ctx.rect(-this.size, -this.size, this.size, this.size * 2);
            else ctx.rect(0, -this.size, this.size, this.size * 2);
            ctx.clip();
            ctx.fillText(this.emoji, 0, 0);
            ctx.restore();
        }
    }

    class Fruit {
        constructor() {
            const d = getDifficulty();
            const bombChance = 0.08 + (d * 0.12);
            const config = Math.random() < bombChance ? BOMB_TYPE : FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
            
            this.config = config;
            this.emoji = config.emoji;
            this.points = config.points;
            this.size = config.size;
            this.hitboxRadius = (config.size / 2) * config.hitbox;
            this.isBomb = config.isBomb || false;
            this.x = Math.random() * (canvasElement.width * 0.8) + (canvasElement.width * 0.1);
            this.y = canvasElement.height + 100;
            
            const centerX = canvasElement.width / 2;
            const speedMultiplier = 1 + (d * 0.4);
            this.vx = (centerX - this.x) * (0.006 + Math.random() * 0.008);
            this.vy = -(Math.random() * 4 + 14) * speedMultiplier;
            this.gravity = 0.22 * speedMultiplier;
            
            this.rotation = Math.random() * Math.PI * 2;
            this.rv = (Math.random() - 0.5) * 0.15;
            this.sliced = false;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            this.rotation += this.rv;
            if (this.y > canvasElement.height + 200 && !this.sliced) {
                if (!this.isBomb) loseLife();
                return false;
            }
            return true;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.font = `${this.size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (this.isBomb) {
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(255, 50, 50, 1)';
            }
            ctx.fillText(this.emoji, 0, 0);
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 18;
            this.vy = (Math.random() - 0.5) * 18;
            this.alpha = 1; this.color = color;
            this.size = Math.random() * 7 + 1;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.alpha -= 0.05; return this.alpha > 0;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }

    function gameLoop() {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        
        // Background Decay logic for performance
        bgCtx.save();
        bgCtx.globalAlpha = 0.0015; 
        bgCtx.fillStyle = '#3d2b1f';
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
        bgCtx.restore();
        drawDojoFloor(bgCtx, false);

        canvasCtx.globalAlpha = 1;
        // Safeguard for drawing background
        if (bgCanvas.width > 0 && bgCanvas.height > 0) {
            canvasCtx.drawImage(bgCanvas, 0, 0);
        }

        if (isGameRunning) {
            slicedPieces = slicedPieces.filter(p => {
                const alive = p.update();
                if (alive) p.draw(canvasCtx);
                return alive;
            });
            if (slicedPieces.length > MAX_PIECES) slicedPieces.shift();

            fruits = fruits.filter(f => {
                const alive = f.update();
                if (alive) f.draw(canvasCtx);
                return alive && !f.sliced;
            });

            particles = particles.filter(p => {
                const alive = p.update();
                if (alive) p.draw(canvasCtx);
                return alive;
            });
            if (particles.length > MAX_PARTICLES) particles.shift();

            const d = getDifficulty();
            const baseSpawnChance = 0.025 + (d * 0.06);
            if (Math.random() < baseSpawnChance) {
                const isBurst = Math.random() < (d * 0.4);
                const count = isBurst ? Math.floor(Math.random() * 2) + 1 : 1;
                for(let i=0; i<count; i++) fruits.push(new Fruit());
            }
        }

        if (handPath.length > 1) {
            canvasCtx.shadowBlur = 20;
            canvasCtx.shadowColor = '#00f2ff';
            canvasCtx.lineCap = 'round';
            canvasCtx.lineJoin = 'round';
            canvasCtx.beginPath();
            canvasCtx.strokeStyle = 'white';
            canvasCtx.lineWidth = 5;
            canvasCtx.moveTo(handPath[0].x, handPath[0].y);
            for (let i = 1; i < handPath.length; i++) canvasCtx.lineTo(handPath[i].x, handPath[i].y);
            canvasCtx.stroke();
            canvasCtx.shadowBlur = 0;
        }

        requestAnimationFrame(gameLoop);
    }

    function checkSlices(p1, p2) {
        fruits.forEach((fruit) => {
            if (fruit.sliced) return;
            const dist = distToSegment(fruit.x, fruit.y, p1.x, p1.y, p2.x, p2.y);
            if (dist < fruit.hitboxRadius) {
                fruit.sliced = true;
                if (fruit.isBomb) {
                    triggerBomb();
                } else {
                    score += fruit.points;
                    scoreVal.innerText = score;
                    updateDifficultyUI();
                    createParticles(fruit.x, fruit.y, fruit.config.color);
                    splitFruit(fruit);
                    addSplatterToBackground(fruit.x, fruit.y, fruit.config.color);
                }
            }
        });
    }

    function splitFruit(fruit) {
        slicedPieces.push(new SlicedPiece(fruit.x, fruit.y, -6, fruit.vy, fruit.rotation, -0.25, fruit.emoji, fruit.size, 0));
        slicedPieces.push(new SlicedPiece(fruit.x, fruit.y, 6, fruit.vy, fruit.rotation, 0.25, fruit.emoji, fruit.size, 1));
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
        const l2 = (x1 - x2) ** 2 + (y1 - y2) ** 2;
        if (l2 === 0) return Math.sqrt((px - x1) ** 2 + (py - y1) ** 2);
        let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.sqrt((px - (x1 + t * (x2 - x1))) ** 2 + (py - (y1 + t * (y2 - y1))) ** 2);
    }

    function createParticles(x, y, color) {
        for (let i = 0; i < 10; i++) particles.push(new Particle(x, y, color));
    }

    function loseLife() {
        lives--;
        updateLivesUI();
        if (lives <= 0) endGame();
    }

    function updateLivesUI() {
        let hearts = '';
        for (let i = 0; i < 3; i++) hearts += i < lives ? '❤️' : '🖤';
        livesContainer.innerText = hearts;
    }

    function triggerBomb() {
        gameContainer.classList.add('shake');
        setTimeout(() => gameContainer.classList.remove('shake'), 400);
        loseLife();
    }

    function endGame() {
        isGameRunning = false;
        finalScoreDisplay.innerText = score;
        gameOverMenu.classList.remove('hidden');
        hud.classList.add('opacity-0');
    }

    function startGame() {
        score = 0; lives = 3;
        fruits = []; slicedPieces = []; particles = []; 
        drawDojoFloor(bgCtx, true); 
        scoreVal.innerText = '0';
        updateDifficultyUI();
        updateLivesUI();
        startMenu.classList.add('hidden');
        gameOverMenu.classList.add('hidden');
        hud.classList.remove('opacity-0');
        isGameRunning = true;
    }

    async function initVision() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 1280, height: 720 }
            });
            videoElement.srcObject = stream;
            await videoElement.play();

            // Run detection loop
            async function processFrame() {
                if (videoElement.readyState >= 3) {
                    await hands.send({ image: videoElement });
                }
                requestAnimationFrame(processFrame);
            }
            processFrame();

            resizeCanvas(); 
            gameLoop(); 
            
            loadingMsg.innerText = "SENSEI READY";
            setTimeout(() => {
                if (!isTrackingWarmedUp) loadingMsg.innerText = "MOVE HAND TO START";
            }, 1000);
            
        } catch (err) {
            loadingMsg.innerText = "CAMERA ACCESS REQUIRED";
            console.error(err);
        }
    }

    initVision();

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
</script>
</body>
</html>
