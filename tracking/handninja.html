<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Ninja - Camera Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a2a3a 0%, #000000 100%);
        }
        /* Mirror the video and canvas for natural movement */
        #input-video, #game-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #input-video {
            opacity: 0.2; /* Darker background for better contrast */
            filter: grayscale(0.3) contrast(1.2);
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .menu-card {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 2rem;
            padding: 3rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

<div id="game-container">
    <video id="input-video" playsinline></video>
    <canvas id="game-canvas"></canvas>

    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud" class="flex justify-between items-start w-full opacity-0 transition-opacity duration-500">
            <div class="flex flex-col">
                <div class="text-xs uppercase tracking-[0.3em] opacity-50 mb-1">Current Score</div>
                <div class="text-6xl font-black italic tracking-tighter" id="score-val">0</div>
            </div>
            <div class="flex flex-col items-end">
                <div id="lives-container" class="text-4xl filter drop-shadow-[0_0_10px_rgba(255,0,0,0.5)]">❤️❤️❤️</div>
                <div class="text-[10px] uppercase tracking-widest mt-3 opacity-40 bg-white/10 px-3 py-1 rounded-full">Tracking Index Finger</div>
            </div>
        </div>

        <!-- Start Menu -->
        <div id="start-menu" class="m-auto menu-card max-w-lg">
            <h1 class="text-7xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-br from-cyan-400 to-blue-600 italic tracking-tighter">HAND NINJA</h1>
            <p class="mb-10 text-lg text-gray-400 font-light">Precision slicing with MediaPipe. <br>Avoid the bombs at all costs.</p>
            <button id="start-btn" class="group relative bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-5 px-16 rounded-2xl text-2xl transition-all transform hover:scale-105 active:scale-95 shadow-[0_0_30px_rgba(6,182,212,0.3)]">
                ENTER DOJO
            </button>
            <div id="loading-msg" class="mt-8 text-xs text-cyan-500 font-mono tracking-widest uppercase animate-pulse">Initializing Vision Systems...</div>
        </div>

        <!-- Game Over Menu -->
        <div id="game-over-menu" class="m-auto menu-card hidden">
            <h1 class="text-6xl font-black mb-2 text-red-500 italic tracking-tighter">GAME OVER</h1>
            <p class="text-4xl mb-8 font-light">Score: <span class="font-bold text-cyan-400" id="final-score">0</span></p>
            <button id="restart-btn" class="bg-white text-black font-black py-4 px-12 rounded-xl text-xl hover:bg-cyan-500 hover:text-white transition-all transform hover:-rotate-1">
                RETRY SESSION
            </button>
        </div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input-video');
    const canvasElement = document.getElementById('game-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const livesContainer = document.getElementById('lives-container');
    const startMenu = document.getElementById('start-menu');
    const gameOverMenu = document.getElementById('game-over-menu');
    const hud = document.getElementById('hud');
    const finalScoreDisplay = document.getElementById('final-score');
    const loadingMsg = document.getElementById('loading-msg');

    // Game State
    let score = 0;
    let lives = 3;
    let isGameRunning = false;
    let fruits = [];
    let particles = [];
    let handPath = []; 
    const MAX_PATH_LENGTH = 10; 
    
    const FRUIT_TYPES = [
        { emoji: '🍎', points: 10, size: 65, hitbox: 1.6 },
        { emoji: '🍊', points: 10, size: 60, hitbox: 1.6 },
        { emoji: '🍉', points: 20, size: 90, hitbox: 1.9 },
        { emoji: '🍍', points: 15, size: 80, hitbox: 1.7 },
        { emoji: '🍓', points: 5, size: 45, hitbox: 1.5 },
        { emoji: '💣', points: -1, size: 75, hitbox: 1.0, isBomb: true }
    ];

    // Initialize MediaPipe Hands
    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 1280,
        height: 720
    });

    function resizeCanvas() {
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ASPECT RATIO FIX: Map landmarks to canvas accounting for object-fit: cover
    function getCanvasCoords(landmark) {
        const videoWidth = videoElement.videoWidth || 1280;
        const videoHeight = videoElement.videoHeight || 720;
        const canvasWidth = canvasElement.width;
        const canvasHeight = canvasElement.height;

        const videoAspect = videoWidth / videoHeight;
        const canvasAspect = canvasWidth / canvasHeight;

        let scale, offsetX = 0, offsetY = 0;

        if (videoAspect > canvasAspect) {
            // Video is wider than canvas (sides are cropped)
            scale = canvasHeight / videoHeight;
            offsetX = (videoWidth * scale - canvasWidth) / 2;
        } else {
            // Video is taller than canvas (top/bottom are cropped)
            scale = canvasWidth / videoWidth;
            offsetY = (videoHeight * scale - canvasHeight) / 2;
        }

        return {
            x: (landmark.x * videoWidth * scale) - offsetX,
            y: (landmark.y * videoHeight * scale) - offsetY
        };
    }

    class Fruit {
        constructor() {
            const config = Math.random() < 0.12 ? FRUIT_TYPES[5] : FRUIT_TYPES[Math.floor(Math.random() * 5)];
            
            this.emoji = config.emoji;
            this.points = config.points;
            this.size = config.size;
            this.hitboxRadius = (config.size / 2) * config.hitbox;
            this.isBomb = config.isBomb || false;
            
            this.x = Math.random() * (canvasElement.width * 0.8) + (canvasElement.width * 0.1);
            this.y = canvasElement.height + 100;
            
            const centerX = canvasElement.width / 2;
            this.vx = (centerX - this.x) * (0.008 + Math.random() * 0.012);
            this.vy = -(Math.random() * 5 + 13);
            this.gravity = 0.22;
            this.rotation = Math.random() * Math.PI * 2;
            this.rv = (Math.random() - 0.5) * 0.12;
            this.sliced = false;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            this.rotation += this.rv;
            
            if (this.y > canvasElement.height + 200 && !this.sliced) {
                if (!this.isBomb) loseLife();
                return false;
            }
            return true;
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.font = `${this.size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            if (this.isBomb) {
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(255, 50, 50, 0.9)';
            } else {
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            }

            ctx.fillText(this.emoji, 0, 0);
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 12;
            this.vy = (Math.random() - 0.5) * 12;
            this.alpha = 1;
            this.color = color;
            this.size = Math.random() * 4 + 1;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.04;
            return this.alpha > 0;
        }

        draw(ctx) {
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    function onResults(results) {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            const tip = landmarks[8]; 
            
            // Map the coordinates correctly accounting for scaling/cropping
            const currentFingerPos = getCanvasCoords(tip);

            handPath.push(currentFingerPos);
            if (handPath.length > MAX_PATH_LENGTH) handPath.shift();

            if (isGameRunning && handPath.length > 1) {
                const lastPos = handPath[handPath.length - 2];
                checkSlices(lastPos, currentFingerPos);
            }
        } else {
            handPath = [];
        }

        if (isGameRunning) {
            updateGame();
        }

        // Sleeker Blade Trail
        if (handPath.length > 1) {
            canvasCtx.shadowBlur = 15;
            canvasCtx.shadowColor = '#00f2ff';
            canvasCtx.lineCap = 'round';
            canvasCtx.lineJoin = 'round';
            
            // Outer glow (thinner than before)
            canvasCtx.beginPath();
            canvasCtx.strokeStyle = 'rgba(0, 242, 255, 0.4)';
            canvasCtx.lineWidth = 10;
            canvasCtx.moveTo(handPath[0].x, handPath[0].y);
            for (let i = 1; i < handPath.length; i++) {
                canvasCtx.lineTo(handPath[i].x, handPath[i].y);
            }
            canvasCtx.stroke();
            
            // Inner core (very sharp)
            canvasCtx.beginPath();
            canvasCtx.strokeStyle = '#fff';
            canvasCtx.lineWidth = 3;
            canvasCtx.moveTo(handPath[0].x, handPath[0].y);
            for (let i = 1; i < handPath.length; i++) {
                canvasCtx.lineTo(handPath[i].x, handPath[i].y);
            }
            canvasCtx.stroke();
            
            canvasCtx.shadowBlur = 0;
        }
    }

    function checkSlices(p1, p2) {
        fruits.forEach((fruit) => {
            if (fruit.sliced) return;

            const dist = distToSegment(fruit.x, fruit.y, p1.x, p1.y, p2.x, p2.y);
            if (dist < fruit.hitboxRadius) {
                fruit.sliced = true;
                if (fruit.isBomb) {
                    triggerBomb();
                } else {
                    score += fruit.points;
                    scoreVal.innerText = score;
                    createParticles(fruit.x, fruit.y, '#00f2ff');
                    
                    // Slice flash
                    canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    canvasCtx.beginPath();
                    canvasCtx.arc(fruit.x, fruit.y, 30, 0, Math.PI * 2);
                    canvasCtx.fill();
                }
            }
        });
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
        const l2 = (x1 - x2) ** 2 + (y1 - y2) ** 2;
        if (l2 === 0) return Math.sqrt((px - x1) ** 2 + (py - y1) ** 2);
        let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.sqrt((px - (x1 + t * (x2 - x1))) ** 2 + (py - (y1 + t * (y2 - y1))) ** 2);
    }

    function createParticles(x, y, color) {
        for (let i = 0; i < 10; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function updateGame() {
        fruits = fruits.filter(f => {
            const alive = f.update();
            if (alive) f.draw(canvasCtx);
            return alive && !f.sliced;
        });

        particles = particles.filter(p => {
            const alive = p.update();
            if (alive) p.draw(canvasCtx);
            return alive;
        });

        const spawnChance = 0.025 + (score / 18000);
        if (Math.random() < spawnChance) {
            fruits.push(new Fruit());
        }
    }

    function loseLife() {
        lives--;
        updateLivesUI();
        if (lives <= 0) endGame();
    }

    function updateLivesUI() {
        let hearts = '';
        for (let i = 0; i < 3; i++) {
            hearts += i < lives ? '❤️' : '🖤';
        }
        livesContainer.innerText = hearts;
    }

    function triggerBomb() {
        createParticles(canvasElement.width/2, canvasElement.height/2, '#ff3232');
        lives = 0;
        updateLivesUI();
        endGame();
    }

    function endGame() {
        isGameRunning = false;
        finalScoreDisplay.innerText = score;
        gameOverMenu.classList.remove('hidden');
        hud.classList.add('opacity-0');
    }

    function startGame() {
        score = 0;
        lives = 3;
        fruits = [];
        particles = [];
        scoreVal.innerText = '0';
        updateLivesUI();
        startMenu.classList.add('hidden');
        gameOverMenu.classList.add('hidden');
        hud.classList.remove('opacity-0');
        isGameRunning = true;
    }

    camera.start().then(() => {
        loadingMsg.innerText = "Vision Authenticated";
        setTimeout(() => loadingMsg.classList.add('opacity-0'), 1000);
    }).catch(err => {
        loadingMsg.innerText = "Error: Camera Access Denied";
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
</script>
</body>
</html>
