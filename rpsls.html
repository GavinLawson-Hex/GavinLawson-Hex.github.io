<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Rock Paper Scissors Lizard Spock - St. Paddy's Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020617;
            color: white;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #064e3b 0%, #020617 100%);
        }
        .video-wrapper {
            position: relative;
            width: 85%;
            max-width: 900px;
            aspect-ratio: 16/9;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), 0 0 20px rgba(16, 185, 129, 0.2);
            background: #0f172a;
            border: 2px solid #059669;
        }
        video {
            width: 100%;
            height: 100%;
            transform: rotateY(180deg);
            object-fit: cover;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotateY(180deg);
            pointer-events: none;
            z-index: 10;
        }
        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
        }
        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .countdown.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.3);
        }
        .ai-hand {
            position: absolute;
            right: 8%;
            top: 50%;
            transform: translateY(-50%);
            font-size: 7rem;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
        }
        .hand-emoji {
            position: absolute;
            font-size: 5rem;
            pointer-events: none;
            z-index: 100;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.5));
        }
        .result-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 2rem;
            background: rgba(6, 78, 59, 0.95);
            border: 3px solid #fbbf24;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 300;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .holiday-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.9);
            z-index: 500;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .holiday-card {
            background: linear-gradient(135deg, #065f46 0%, #064e3b 100%);
            padding: 3rem;
            border-radius: 40px;
            border: 4px solid #fbbf24;
            box-shadow: 0 0 100px rgba(16, 185, 129, 0.4);
            max-width: 600px;
            width: 90%;
        }
        .shamrock-float {
            position: absolute;
            font-size: 2rem;
            pointer-events: none;
            animation: drift 5s linear infinite;
        }
        @keyframes drift {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .btn {
            pointer-events: auto;
            background: #10b981;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn:hover:not(:disabled) { transform: scale(1.05); background: #059669; box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .gesture-legend {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
            z-index: 30;
        }
        .legend-item {
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .win-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .win-dot.active {
            background: #fbbf24;
            box-shadow: 0 0 8px #fbbf24;
            border-color: #fbbf24;
        }
        .timer-bar {
            height: 6px;
            background: #fbbf24;
            width: 0%;
            transition: width 0.1s linear;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Scoreboard -->
    <div class="flex gap-12 mb-6 items-center z-30">
        <div class="text-center">
            <p class="text-emerald-400 text-xs tracking-widest font-bold">LUCK OF PLAYER</p>
            <p id="player-score" class="text-6xl font-black text-white">0</p>
            <div class="flex gap-1 justify-center mt-2" id="player-dots">
                <div class="win-dot"></div><div class="win-dot"></div><div class="win-dot"></div><div class="win-dot"></div><div class="win-dot"></div>
            </div>
        </div>
        <div class="px-4 py-1 bg-emerald-500/20 rounded-lg text-emerald-400 font-bold border border-emerald-500/30">BEST OF 5</div>
        <div class="text-center">
            <p class="text-emerald-400 text-xs tracking-widest font-bold">LEPRECHAUN BOT</p>
            <p id="ai-score" class="text-6xl font-black text-white">0</p>
            <div class="flex gap-1 justify-center mt-2" id="ai-dots">
                <div class="win-dot"></div><div class="win-dot"></div><div class="win-dot"></div><div class="win-dot"></div><div class="win-dot"></div>
            </div>
        </div>
    </div>

    <div class="video-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
        
        <div class="ui-layer">
            <div id="status-badge" class="bg-black/60 backdrop-blur self-start px-4 py-1.5 rounded-full border border-emerald-500/30 text-xs text-emerald-400">
                Finding Clover...
            </div>
            
            <div id="ai-hand-display" class="ai-hand" style="display:none">🤖</div>
            <div id="countdown-text" class="countdown">3</div>
            
            <div id="player-hand-overlay" class="hand-emoji" style="display:none"></div>
        </div>
    </div>

    <div class="mt-6 z-30 flex flex-col items-center gap-6">
        <button id="start-btn" class="btn text-lg px-12 py-4">ROLL THE DICE</button>
        
        <div class="gesture-legend">
            <div class="legend-item"><span class="block text-xl">✊</span>ROCK</div>
            <div class="legend-item"><span class="block text-xl">🖐️</span>PAPER</div>
            <div class="legend-item"><span class="block text-xl">✌️</span>SCISSORS</div>
            <div class="legend-item"><span class="block text-xl">🦎</span>LIZARD</div>
            <div class="legend-item"><span class="block text-xl">🖖</span>SPOCK</div>
        </div>
    </div>

    <!-- Result Pop-up (Non-blocking) -->
    <div id="result-modal" class="result-banner hidden">
        <div id="result-title" class="text-4xl font-black mb-2 text-white">WINNER!</div>
        <div id="result-logic" class="text-emerald-300 mb-4 text-lg italic">Logic goes here</div>
        <div class="w-full bg-emerald-900 rounded-full h-2 mb-2">
            <div id="next-round-timer" class="timer-bar"></div>
        </div>
        <div class="text-xs text-emerald-400 font-bold uppercase tracking-wider">Next round starting soon...</div>
    </div>

    <!-- Final St Patrick's Holiday Screen -->
    <div id="holiday-screen" class="holiday-overlay">
        <div class="holiday-card">
            <div id="holiday-emoji" class="text-8xl mb-4">🌈</div>
            <h1 id="holiday-title" class="text-5xl font-black text-white mb-2 underline decoration-yellow-400">HAPPY ST. PADDY'S!</h1>
            <p id="holiday-message" class="text-emerald-100 text-xl mb-8">You've found the pot of gold at the end of the rainbow!</p>
            <button id="reset-tournament" class="btn bg-yellow-500 hover:bg-yellow-600 text-black font-black text-xl py-4 px-12 rounded-2xl shadow-xl">PLAY NEW MATCH</button>
        </div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusLabel = document.getElementById('status-badge');
    const countdownEl = document.getElementById('countdown-text');
    const startBtn = document.getElementById('start-btn');
    const aiHandEl = document.getElementById('ai-hand-display');
    const playerHandOverlay = document.getElementById('player-hand-overlay');
    const resultModal = document.getElementById('result-modal');
    const resultTitle = document.getElementById('result-title');
    const resultLogic = document.getElementById('result-logic');
    const timerBar = document.getElementById('next-round-timer');
    const holidayScreen = document.getElementById('holiday-screen');
    const holidayTitle = document.getElementById('holiday-title');
    const holidayMessage = document.getElementById('holiday-message');
    const holidayEmoji = document.getElementById('holiday-emoji');
    const resetBtn = document.getElementById('reset-tournament');

    let playerScore = 0;
    let aiScore = 0;
    let isPlaying = false;
    let isAutoPlaying = false;
    let currentGesture = null;
    const WIN_LIMIT = 5;

    const GESTURES = {
        ROCK: { emoji: '✊', beats: ['SCISSORS', 'LIZARD'], verbs: ['crushes', 'crushes'] },
        PAPER: { emoji: '🖐️', beats: ['ROCK', 'SPOCK'], verbs: ['covers', 'disproves'] },
        SCISSORS: { emoji: '✌️', beats: ['PAPER', 'LIZARD'], verbs: ['cuts', 'decapitates'] },
        LIZARD: { emoji: '🦎', beats: ['SPOCK', 'PAPER'], verbs: ['poisons', 'eats'] },
        SPOCK: { emoji: '🖖', beats: ['SCISSORS', 'ROCK'], verbs: ['smashes', 'vaporizes'] }
    };

    function onResults(results) {
        canvasElement.width = videoElement.clientWidth;
        canvasElement.height = videoElement.clientHeight;
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        currentGesture = null;
        playerHandOverlay.style.display = 'none';

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            statusLabel.innerText = "🍀 Clover Found!";
            statusLabel.style.color = "#34d399";

            const landmarks = results.multiHandLandmarks[0];
            const detected = analyzeGesture(landmarks);
            
            if (detected) {
                currentGesture = detected;
                const point = landmarks[9];
                
                playerHandOverlay.style.display = 'block';
                playerHandOverlay.innerText = GESTURES[detected].emoji;
                
                const rect = videoElement.getBoundingClientRect();
                const x = (1 - point.x) * rect.width;
                const y = point.y * rect.height;
                playerHandOverlay.style.left = `${x}px`;
                playerHandOverlay.style.top = `${y}px`;
                playerHandOverlay.style.transform = `translate(-50%, -50%)`;
            }
        } else {
            statusLabel.innerText = "Searching for Hand...";
            statusLabel.style.color = "#fbbf24";
        }
        canvasCtx.restore();
    }

    function analyzeGesture(lm) {
        const isFingerUp = (tip, mcp) => lm[tip].y < lm[mcp].y;
        const indexUp = isFingerUp(8, 6);
        const middleUp = isFingerUp(12, 10);
        const ringUp = isFingerUp(16, 14);
        const pinkyUp = isFingerUp(20, 18);
        const thumbTip = lm[4];
        const indexBase = lm[5];
        const middleBase = lm[9];

        const spockGap = Math.abs(lm[12].x - lm[16].x);
        if (indexUp && middleUp && ringUp && pinkyUp && spockGap > 0.07) return "SPOCK";
        if (indexUp && middleUp && ringUp && pinkyUp) return "PAPER";
        if (indexUp && middleUp && !ringUp && !pinkyUp) return "SCISSORS";

        const isHorizontal = Math.abs(indexBase.y - middleBase.y) < 0.05;
        const thumbDistFromFingers = Math.hypot(thumbTip.x - indexBase.x, thumbTip.y - indexBase.y);
        const fingersCurled = !indexUp && !middleUp && !ringUp && !pinkyUp;
        if (isHorizontal && fingersCurled && thumbDistFromFingers > 0.08) return "LIZARD";

        const thumbTucked = thumbDistFromFingers < 0.08;
        if (fingersCurled && thumbTucked) return "ROCK";

        return null;
    }

    async function playRound() {
        if (isPlaying || playerScore >= WIN_LIMIT || aiScore >= WIN_LIMIT) return;
        
        isPlaying = true;
        isAutoPlaying = true;
        startBtn.disabled = true;
        startBtn.innerText = "BATTLE IN PROGRESS";
        aiHandEl.style.display = 'none';
        resultModal.classList.add('hidden');

        const sequence = ['3', '2', '1', 'LUCK!'];
        for (const step of sequence) {
            countdownEl.innerText = step;
            countdownEl.classList.add('active');
            await new Promise(r => setTimeout(r, 800));
            countdownEl.classList.remove('active');
            await new Promise(r => setTimeout(r, 100));
        }

        const options = Object.keys(GESTURES);
        const aiChoice = options[Math.floor(Math.random() * options.length)];
        const playerChoice = currentGesture;

        aiHandEl.innerText = GESTURES[aiChoice].emoji;
        aiHandEl.style.display = 'block';

        evaluateWinner(playerChoice, aiChoice);
    }

    function evaluateWinner(player, ai) {
        let type = "neutral";
        if (!player) {
            showResult("WHERE'S YOUR LUCK?", "No hand detected!", "lose");
        } else if (player === ai) {
            showResult("STALEMATE!", `${player} ties with ${ai}`, "neutral");
        } else if (GESTURES[player].beats.includes(ai)) {
            const verbIndex = GESTURES[player].beats.indexOf(ai);
            const verb = GESTURES[player].verbs[verbIndex];
            playerScore++;
            updateScoreDots();
            showResult("YOU WIN!", `${player} ${verb} ${ai}`, "win");
        } else {
            const verbIndex = GESTURES[ai].beats.indexOf(player);
            const verb = GESTURES[ai].verbs[verbIndex];
            aiScore++;
            updateScoreDots();
            showResult("AI WINS!", `${ai} ${verb} ${player}`, "lose");
        }
        
        // Start auto-countdown to next round
        startNextRoundTimer();
    }

    async function startNextRoundTimer() {
        if (playerScore >= WIN_LIMIT || aiScore >= WIN_LIMIT) {
            // Tournament is over, show final screen after a small delay
            await new Promise(r => setTimeout(r, 1500));
            resultModal.classList.add('hidden');
            checkTournamentEnd();
            return;
        }

        let timeLeft = 5000;
        const interval = 100;
        
        const timerInterval = setInterval(() => {
            timeLeft -= interval;
            const percentage = (timeLeft / 5000) * 100;
            timerBar.style.width = `${percentage}%`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                isPlaying = false;
                playRound();
            }
        }, interval);
    }

    function updateScoreDots() {
        document.getElementById('player-score').innerText = playerScore;
        document.getElementById('ai-score').innerText = aiScore;
        
        const pDots = document.getElementById('player-dots').children;
        const aDots = document.getElementById('ai-dots').children;
        
        for(let i=0; i<WIN_LIMIT; i++) {
            if (i < playerScore) pDots[i].classList.add('active');
            if (i < aiScore) aDots[i].classList.add('active');
        }
    }

    function showResult(title, logic, type) {
        resultTitle.innerText = title;
        resultLogic.innerText = logic;
        resultModal.classList.remove('hidden');
        resultModal.style.opacity = '1';
        timerBar.style.width = '100%';
        
        if (type === 'win') resultModal.style.borderColor = '#10b981';
        else if (type === 'lose') resultModal.style.borderColor = '#ef4444';
        else resultModal.style.borderColor = '#fbbf24';
    }

    function checkTournamentEnd() {
        if (playerScore >= WIN_LIMIT) showHolidayScreen(true);
        else if (aiScore >= WIN_LIMIT) showHolidayScreen(false);
    }

    function showHolidayScreen(isWin) {
        holidayScreen.style.display = 'flex';
        if (isWin) {
            holidayEmoji.innerText = "💰";
            holidayTitle.innerText = "TOP O' THE WORLD!";
            holidayMessage.innerText = "You've won the pot of gold! 5 wins against the Leprechaun Bot. Truly the luckiest!";
            spawnShamrocks();
        } else {
            holidayEmoji.innerText = "⛈️";
            holidayTitle.innerText = "LUCK RAN OUT!";
            holidayMessage.innerText = "The Leprechaun Bot outsmarted you this time. No gold today, only a rainy cloud!";
        }
    }

    function spawnShamrocks() {
        for(let i=0; i<30; i++) {
            const s = document.createElement('div');
            s.className = 'shamrock-float';
            s.innerText = ['☘️', '🍀', '✨'][Math.floor(Math.random()*3)];
            s.style.left = Math.random() * 100 + 'vw';
            s.style.animationDelay = Math.random() * 5 + 's';
            s.style.color = '#10b981';
            holidayScreen.appendChild(s);
        }
    }

    resetBtn.onclick = () => {
        playerScore = 0;
        aiScore = 0;
        updateScoreDots();
        const dots = document.querySelectorAll('.win-dot');
        dots.forEach(d => d.classList.remove('active'));
        holidayScreen.style.display = 'none';
        isPlaying = false;
        isAutoPlaying = false;
        startBtn.disabled = false;
        startBtn.innerText = "ROLL THE DICE";
        const shamrocks = document.querySelectorAll('.shamrock-float');
        shamrocks.forEach(s => s.remove());
    };

    startBtn.onclick = playRound;

    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.75,
        minTrackingConfidence: 0.75
    });

    hands.onResults(onResults);

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            videoElement.srcObject = stream;
            videoElement.onloadedmetadata = () => detect();
        } catch (e) {
            statusLabel.innerText = "Camera Blocked";
        }
    }

    async function detect() {
        if (videoElement.readyState >= 2) {
            await hands.send({image: videoElement});
        }
        requestAnimationFrame(detect);
    }

    window.onload = startCamera;
</script>

</body>
</html>
