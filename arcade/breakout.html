<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Breakout Ultra</title>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --gold-color: #f59e0b;
            --fire-color: #f97316;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #334155;
            background: #000;
        }

        canvas {
            display: block;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(2, 6, 23, 0.9);
            z-index: 20;
            transition: all 0.3s ease;
            text-align: center;
        }

        .hidden { display: none !important; }

        h1 { 
            margin: 0 0 10px 0; 
            font-size: 3rem; 
            letter-spacing: 4px;
            background: linear-gradient(to bottom, #fff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
        }

        .btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
            filter: brightness(1.1);
        }

        .stats-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background: rgba(15, 23, 42, 0.9);
            font-size: 14px;
            font-weight: bold;
            color: #94a3b8;
            border-bottom: 2px solid #334155;
            z-index: 15;
        }

        .stat-item span { color: #fff; margin-left: 4px; }
        
        #pauseIndicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            opacity: 0.2;
            pointer-events: none;
            font-weight: 900;
            color: white;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="stats-bar">
            <div class="stat-item">LEVEL <span id="levelVal">1</span></div>
            <div class="stat-item">SCORE <span id="scoreVal">0</span></div>
            <div class="stat-item">LIVES <span id="livesVal">3</span></div>
            <div class="stat-item">HIGH <span id="highScoreVal">0</span></div>
        </div>

        <div id="pauseIndicator" class="hidden">PAUSED</div>

        <canvas id="gameCanvas"></canvas>

        <!-- Screens -->
        <div id="startScreen" class="ui-overlay">
            <h1>BREAKOUT</h1>
            <p style="color: #94a3b8; max-width: 400px; line-height: 1.6;">
                Arrows to move • [P] to Pause<br>
                Catch power-ups for maximum destruction!
            </p>
            <button class="btn" onclick="startGame()">Start Mission</button>
        </div>

        <div id="gameOverScreen" class="ui-overlay hidden">
            <h1 id="endTitle">GAME OVER</h1>
            <p id="endMessage" style="font-size: 1.2rem;"></p>
            <button class="btn" onclick="resetGame()">Try Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelDisplay = document.getElementById('levelVal');
        const scoreDisplay = document.getElementById('scoreVal');
        const livesDisplay = document.getElementById('livesVal');
        const highScoreDisplay = document.getElementById('highScoreVal');
        
        // Settings
        canvas.width = 700;
        canvas.height = 500;
        const TOP_BAR_HEIGHT = 40;
        const PADDLE_WIDTH_DEFAULT = 100;
        const PADDLE_HEIGHT = 12;
        const BALL_RADIUS = 8;
        const BRICK_HEIGHT = 20;
        const INITIAL_BALL_SPEED = 4.5; 

        // Audio System
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let musicInterval;

        function playSound(freq, type, duration, vol = 0.1) {
            if (AudioCtx.state === 'suspended') return;
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, AudioCtx.currentTime);
            osc.connect(gain);
            gain.connect(AudioCtx.destination);
            gain.gain.setValueAtTime(vol, AudioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, AudioCtx.currentTime + duration);
            osc.start();
            osc.stop(AudioCtx.currentTime + duration);
        }

        function startMusic() {
            if (musicInterval) clearInterval(musicInterval);
            let beat = 0;
            const notes = [110, 110, 130, 110, 164, 110, 130, 146]; 
            musicInterval = setInterval(() => {
                if (state.gameRunning && !state.paused) {
                    const freq = notes[beat % notes.length];
                    playSound(freq, 'triangle', 0.15, 0.04);
                    beat++;
                }
            }, 250);
        }

        // Game State
        let state = {
            gameRunning: false,
            paused: false,
            score: 0,
            highScore: localStorage.getItem('breakoutHigh') || 0,
            lives: 3,
            level: 1,
            shake: 0,
            paddle: { x: 300, w: PADDLE_WIDTH_DEFAULT },
            balls: [],
            bricks: [],
            particles: [],
            powerUps: [],
            keys: { left: false, right: false },
            isFireball: false,
            fireballTimer: null
        };

        highScoreDisplay.innerText = state.highScore;

        class Ball {
            constructor(x, y, dx, dy) {
                this.x = x;
                this.y = y;
                this.dx = dx;
                this.dy = dy;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 4 + 2;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.life = 1.0;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.04;
            }
        }

        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; 
                this.w = 30;
                this.h = 16;
                this.rotation = 0;
            }
            update() { 
                this.y += 2.2; 
                this.rotation += 0.05;
            }
        }

        function initBricks() {
            state.bricks = [];
            const cols = 9;
            const rows = 3 + Math.min(state.level, 5);
            const padding = 10;
            const offsetTop = TOP_BAR_HEIGHT + 30;
            const offsetLeft = 25;
            const brickWidth = (canvas.width - (offsetLeft * 2) - (padding * (cols - 1))) / cols;

            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows; r++) {
                    const colors = ['#ef4444', '#f97316', '#f59e0b', '#22c55e', '#3b82f6', '#8b5cf6'];
                    state.bricks.push({
                        x: c * (brickWidth + padding) + offsetLeft,
                        y: r * (BRICK_HEIGHT + padding) + offsetTop,
                        w: brickWidth,
                        status: 1,
                        color: colors[(r + state.level) % colors.length]
                    });
                }
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 6; i++) {
                state.particles.push(new Particle(x, y, color));
            }
        }

        function spawnPowerUp(x, y) {
            if (Math.random() > 0.88) {
                const types = ['WIDE', 'MULTIBALL', 'FIREBALL'];
                state.powerUps.push(new PowerUp(x, y, types[Math.floor(Math.random() * types.length)]));
            }
        }

        function applyPowerUp(type) {
            playSound(600, 'square', 0.2, 0.15);
            if (type === 'WIDE') {
                state.paddle.w = 180;
                setTimeout(() => state.paddle.w = PADDLE_WIDTH_DEFAULT, 10000);
            } else if (type === 'MULTIBALL') {
                const b = state.balls[0] || { x: 350, y: 400 };
                state.balls.push(new Ball(b.x, b.y, INITIAL_BALL_SPEED, -INITIAL_BALL_SPEED));
                state.balls.push(new Ball(b.x, b.y, -INITIAL_BALL_SPEED, -INITIAL_BALL_SPEED));
            } else if (type === 'FIREBALL') {
                state.isFireball = true;
                if (state.fireballTimer) clearTimeout(state.fireballTimer);
                state.fireballTimer = setTimeout(() => state.isFireball = false, 5000);
            }
        }

        function update() {
            if (!state.gameRunning || state.paused) return;

            if (state.shake > 0) state.shake *= 0.85;

            if (state.keys.right && state.paddle.x < canvas.width - state.paddle.w) state.paddle.x += 8;
            if (state.keys.left && state.paddle.x > 0) state.paddle.x -= 8;

            for (let i = state.particles.length - 1; i >= 0; i--) {
                state.particles[i].update();
                if (state.particles[i].life <= 0) state.particles.splice(i, 1);
            }

            for (let i = state.powerUps.length - 1; i >= 0; i--) {
                const p = state.powerUps[i];
                p.update();
                if (p.y + p.h > canvas.height - 20 - PADDLE_HEIGHT && 
                    p.x + p.w/2 > state.paddle.x && p.x - p.w/2 < state.paddle.x + state.paddle.w) {
                    applyPowerUp(p.type);
                    state.powerUps.splice(i, 1);
                } else if (p.y > canvas.height) {
                    state.powerUps.splice(i, 1);
                }
            }

            for (let bIdx = state.balls.length - 1; bIdx >= 0; bIdx--) {
                const ball = state.balls[bIdx];
                ball.x += ball.dx;
                ball.y += ball.dy;

                if (ball.x + ball.dx > canvas.width - BALL_RADIUS || ball.x + ball.dx < BALL_RADIUS) {
                    ball.dx = -ball.dx;
                    playSound(400, 'sine', 0.05);
                }
                
                if (ball.y + ball.dy < BALL_RADIUS + TOP_BAR_HEIGHT) {
                    ball.dy = -ball.dy;
                    ball.y = BALL_RADIUS + TOP_BAR_HEIGHT;
                    playSound(400, 'sine', 0.05);
                }

                if (ball.y + ball.dy > canvas.height - 20 - PADDLE_HEIGHT) {
                    if (ball.x > state.paddle.x && ball.x < state.paddle.x + state.paddle.w) {
                        playSound(250, 'triangle', 0.1);
                        const relX = (ball.x - (state.paddle.x + state.paddle.w / 2)) / (state.paddle.w / 2);
                        ball.dx = relX * 7; 
                        ball.dy = -Math.abs(ball.dy);
                        state.shake = 3;
                    } 
                    else if (ball.y > canvas.height + BALL_RADIUS) {
                        state.balls.splice(bIdx, 1);
                        if (state.balls.length === 0) {
                            state.lives--;
                            livesDisplay.innerText = state.lives;
                            state.shake = 10;
                            playSound(100, 'sawtooth', 0.4);
                            if (state.lives <= 0) endGame(false);
                            else resetBall();
                        }
                    }
                }

                for (let i = 0; i < state.bricks.length; i++) {
                    const brick = state.bricks[i];
                    if (brick.status === 1) {
                        if (ball.x > brick.x && ball.x < brick.x + brick.w && 
                            ball.y > brick.y && ball.y < brick.y + BRICK_HEIGHT) {
                            
                            // IF FIREBALL, DON'T BOUNCE
                            if (!state.isFireball) {
                                ball.dy = -ball.dy;
                            }
                            
                            brick.status = 0;
                            state.score += 10;
                            scoreDisplay.innerText = state.score;
                            createParticles(brick.x + brick.w / 2, brick.y + BRICK_HEIGHT / 2, brick.color);
                            spawnPowerUp(brick.x + brick.w / 2, brick.y);
                            playSound(300 + Math.random() * 100, 'sine', 0.1);
                            state.shake = state.isFireball ? 8 : 4;
                            if (state.bricks.every(b => b.status === 0)) nextLevel();
                            break; 
                        }
                    }
                }
            }
        }

        function render() {
            ctx.save();
            if (state.shake > 0.5) {
                ctx.translate(Math.random() * state.shake - state.shake/2, Math.random() * state.shake - state.shake/2);
            }

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0a0f1e';
            ctx.fillRect(0, 0, canvas.width, TOP_BAR_HEIGHT);

            state.bricks.forEach(b => {
                if (b.status === 1) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = b.color;
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.roundRect(b.x, b.y, b.w, BRICK_HEIGHT, 4);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.fillRect(b.x, b.y, b.w, 4);
                }
            });
            ctx.shadowBlur = 0;

            const grd = ctx.createLinearGradient(state.paddle.x, 0, state.paddle.x + state.paddle.w, 0);
            grd.addColorStop(0, '#38bdf8');
            grd.addColorStop(0.5, '#7dd3fc');
            grd.addColorStop(1, '#38bdf8');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.roundRect(state.paddle.x, canvas.height - 20, state.paddle.w, PADDLE_HEIGHT, 6);
            ctx.fill();

            state.balls.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI * 2);
                
                if (state.isFireball) {
                    ctx.fillStyle = "#fbbf24";
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "#f97316";
                } else {
                    ctx.fillStyle = "#fff";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#fff";
                }
                
                ctx.fill();
                ctx.closePath();
            });
            ctx.shadowBlur = 0;

            state.particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1;

            state.powerUps.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                let pColor = '#f59e0b'; let icon = '★';
                if(p.type === 'WIDE') { pColor = '#38bdf8'; icon = '↔'; }
                if(p.type === 'FIREBALL') { pColor = '#f97316'; icon = '🔥'; }
                ctx.shadowBlur = 15; ctx.shadowColor = pColor;
                ctx.fillStyle = pColor;
                ctx.beginPath(); ctx.roundRect(-p.w/2, -p.h/2, p.w, p.h, 8); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(icon, 0, 0);
                ctx.restore();
            });

            ctx.restore();
            if (state.gameRunning) requestAnimationFrame(() => { update(); render(); });
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") state.keys.right = true;
            if (e.key === "ArrowLeft") state.keys.left = true;
            if (e.key.toLowerCase() === "p") togglePause();
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight") state.keys.right = false;
            if (e.key === "ArrowLeft") state.keys.left = false;
        });

        function togglePause() {
            if (!state.gameRunning) return;
            state.paused = !state.paused;
            document.getElementById('pauseIndicator').classList.toggle('hidden', !state.paused);
            if (!state.paused) render();
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            if (AudioCtx.state === 'suspended') AudioCtx.resume().then(startMusic);
            else startMusic();
            
            resetBall();
            initBricks();
            state.gameRunning = true;
            render();
        }

        function nextLevel() {
            state.level++;
            levelDisplay.innerText = state.level;
            playSound(500, 'sine', 0.5);
            initBricks();
            resetBall();
        }

        function resetBall() {
            state.balls = [new Ball(canvas.width / 2, canvas.height - 60, INITIAL_BALL_SPEED, -INITIAL_BALL_SPEED)];
            state.paddle.x = (canvas.width - state.paddle.w) / 2;
            state.isFireball = false;
        }

        function resetGame() {
            state.score = 0; state.lives = 3; state.level = 1;
            state.powerUps = []; state.particles = [];
            scoreDisplay.innerText = "0"; livesDisplay.innerText = "3"; levelDisplay.innerText = "1";
            document.getElementById('gameOverScreen').classList.add('hidden');
            startGame();
        }

        function endGame(win) {
            state.gameRunning = false;
            if (state.score > state.highScore) {
                state.highScore = state.score;
                localStorage.setItem('breakoutHigh', state.highScore);
                highScoreDisplay.innerText = state.highScore;
            }
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('endTitle').innerText = win ? "VICTORY" : "GAME OVER";
            document.getElementById('endMessage').innerText = `Final Score: ${state.score}`;
        }
    </script>
</body>
</html>
