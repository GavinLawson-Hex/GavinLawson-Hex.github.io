
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudNote - Vanilla JS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4 md:p-8 font-sans">

    <div id="app" class="max-w-2xl mx-auto">
        <!-- Loading State -->
        <div id="loading-overlay" class="fixed inset-0 bg-slate-50 flex flex-col items-center justify-center z-50">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-600 font-medium">Connecting to Secure Cloud...</p>
        </div>

        <!-- Header -->
        <header class="flex items-center justify-between mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-500 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="text-white w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19c.6 0 1.1-.4 1.4-.9.6-1.1.7-2.4.3-3.6-.3-1.2-1.1-2.2-2.2-2.7-.1-.4-.2-.8-.4-1.2-.7-1.4-2.2-2.3-3.7-2.1-1.3.1-2.4.9-3 2-.3-.1-.6-.1-.9-.1-1.9 0-3.5 1.6-3.5 3.5 0 .3.1.6.2.9-1.1.5-1.8 1.6-1.8 2.8 0 1.7 1.4 3.1 3.1 3.1h10.5z"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">CloudNote</h1>
                    <p class="text-xs text-slate-400 flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full"></span> Secure Sync Enabled
                    </p>
                </div>
            </div>
            <div id="user-badge" class="flex items-center gap-2 px-3 py-1 bg-slate-100 rounded-full text-[10px] font-mono text-slate-500">
                AUTH: ...
            </div>
        </header>

        <!-- Input Form -->
        <form id="note-form" class="mb-8 relative">
            <input
                type="text"
                id="note-input"
                placeholder="Type a new thought..."
                class="w-full bg-white border border-slate-200 rounded-2xl py-4 pl-6 pr-16 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                required
            >
            <button
                type="submit"
                id="submit-btn"
                class="absolute right-2 top-2 bottom-2 aspect-square bg-blue-500 text-white rounded-xl flex items-center justify-center hover:bg-blue-600 transition-colors shadow-lg shadow-blue-200"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </form>

        <!-- Error Container -->
        <div id="error-msg" class="hidden mb-6 p-4 bg-red-50 border border-red-100 text-red-600 rounded-xl text-sm animate-in"></div>

        <!-- Notes List -->
        <div id="notes-list" class="space-y-4">
            <!-- Notes injected here -->
        </div>

        <footer class="mt-12 text-center">
            <p id="user-id-display" class="text-slate-400 text-sm">Initializing...</p>
        </footer>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        // User's Provided Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC8YzGJ7RLcwDjTFUy6fBqlae7gBRBmBC8",
            authDomain: "cloud-notebook-2d8a5.firebaseapp.com",
            projectId: "cloud-notebook-2d8a5",
            storageBucket: "cloud-notebook-2d8a5.firebasestorage.app",
            messagingSenderId: "1050637238876",
            appId: "1:1050637238876:web:d54b643f4b0e5a55f19c99",
            measurementId: "G-BF05169CNP"
        };

        // Initialize Firebase services
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Environment App ID fallback
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cloud-notebook-demo';

        // UI Elements
        const loadingOverlay = document.getElementById('loading-overlay');
        const notesList = document.getElementById('notes-list');
        const noteForm = document.getElementById('note-form');
        const noteInput = document.getElementById('note-input');
        const errorMsg = document.getElementById('error-msg');
        const userBadge = document.getElementById('user-badge');
        const userIdDisplay = document.getElementById('user-id-display');

        let currentUser = null;

        // 1. Auth Logic
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                showError("Auth failed: " + err.message);
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                loadingOverlay.classList.add('hidden');
                userBadge.textContent = user.uid.substring(0, 8) + '...';
                userIdDisplay.textContent = `User ID: ${user.uid}`;
                setupSync(user.uid);
            }
        });

        // 2. Data Sync Logic
        function setupSync(uid) {
            const notesCollection = collection(db, 'artifacts', appId, 'users', uid, 'notes');
            
            onSnapshot(notesCollection, (snapshot) => {
                const notes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Sort by time in memory
                notes.sort((a, b) => {
                    const timeA = a.createdAt?.seconds || 0;
                    const timeB = b.createdAt?.seconds || 0;
                    return timeB - timeA;
                });

                renderNotes(notes);
            }, (err) => {
                showError("Database sync failed: " + err.message);
            });
        }

        // 3. Form Operations
        noteForm.onsubmit = async (e) => {
            e.preventDefault();
            const text = noteInput.value.trim();
            if (!text || !currentUser) return;

            try {
                const notesCollection = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'notes');
                await addDoc(notesCollection, {
                    text: text,
                    createdAt: serverTimestamp()
                });
                noteInput.value = '';
            } catch (err) {
                showError("Failed to save note.");
            }
        };

        // Global delete function
        window.deleteNote = async (id) => {
            if (!currentUser) return;
            try {
                const noteDoc = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'notes', id);
                await deleteDoc(noteDoc);
            } catch (err) {
                showError("Failed to delete note.");
            }
        };

        // 4. Rendering Logic
        function renderNotes(notes) {
            if (notes.length === 0) {
                notesList.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border-2 border-dashed border-slate-200">
                        <p class="text-slate-400">Cloud is empty. Start writing!</p>
                    </div>`;
                return;
            }

            notesList.innerHTML = notes.map(note => `
                <div class="group flex items-center justify-between bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md hover:border-blue-100 transition-all animate-in">
                    <div class="flex-1">
                        <p class="text-slate-700 leading-relaxed">${escapeHtml(note.text)}</p>
                        <span class="text-[10px] text-slate-400 mt-2 block uppercase tracking-wider font-semibold">
                            ${note.createdAt ? new Date(note.createdAt.seconds * 1000).toLocaleString() : 'Syncing...'}
                        </span>
                    </div>
                    <button
                        onclick="deleteNote('${note.id}')"
                        class="ml-4 p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all opacity-0 group-hover:opacity-100"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    </button>
                </div>
            `).join('');
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
            setTimeout(() => errorMsg.classList.add('hidden'), 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Start Auth process
        initAuth();
    </script>
</body>
</html>
